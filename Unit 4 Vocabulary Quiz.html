const SC={},NM={syn:'Synonyms',ant:'Antonyms',spell:'Spelling',match:'Match',sent:'Sentences'};
function rec(id,s,m){SC[id]={s,m};upd()}
function upd(){Object.keys(NM).forEach(k=>{const b=$('#bd-'+k);if(b)b.textContent=SC[k]?SC[k].s+' / '+SC[k].m:''})}
function total(){let s=0,m=0,n=0;const rows=Object.keys(NM).map(k=>{const r=SC[k];if(r){s+=r.s;m+=r.m;n++}return `<div class="row${r?'':' na'}"><span>${NM[k]}</span><span>${r?r.s+' / '+r.m:'not done yet · لسه'}</span></div>`}).join('');
 stage.innerHTML=`<div class="prog"><span>Your scores · درجاتك</span></div>${rows}<div class="big">${s} / ${m||'—'}</div><p>${n===0?'Finish a section to see your score. · خلّص قسم عشان تشوف درجتك':`${Math.round(s/m*100)}% from ${n} of 5 sections.${n<5?' Finish the rest to add them to your total. · كمّل الباقي عشان يتجمع':' All five sections are in your total. · اتجمعوا كلهم'}`}</p><button class="btn alt" id="rs" style="margin-inline-start:0">Reset scores · امسح الدرجات</button>`;
 $('#rs').onclick=()=>{Object.keys(SC).forEach(k=>delete SC[k]);upd();total()}}
const modes=[['syn','Synonyms','مرادفات',()=>mcq(qSyn(),()=>go('syn'),'syn')],['ant','Antonyms','أضداد',()=>mcq(qAnt(),()=>go('ant'),'ant')],['spell','Spelling','اكتب الكلمة',spell],['match','Match','وصّل',match],['sent','Sentences','الجُمل',()=>mcq(qSent(),()=>go('sent'),'sent')],['tot','Total','المجموع',total]];
function go(id){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.m===id));modes.find(m=>m[0]===id)[3]()}
$('#tabs').innerHTML=modes.map(m=>`<button class="tab" role="tab" data-m="${m[0]}" aria-selected="false">${m[1]}<small lang="ar">${m[2]}</small><span class="bd" id="bd-${m[0]}"></span></button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.m));
go('syn');
</script></body></html>
